<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <button
        id="settings-open"
        class="settings-button flex items-center gap-2 rounded-theme bg-page-foreground/15 hover:bg-page-foreground/25 text-page-foreground transition-colors"
        aria-label="Open settings"
      >
        <span class="settings-button-label">Settings</span>
      </button>

      <div id="layout-stage" class="layout-stage fixed inset-0"></div>

      <div id="layout-parking" hidden>
        <div id="widgets" class="flex items-center gap-2">
          <button
            id="calendar-trigger"
            class="flex items-center gap-1 h-12 px-3 rounded-lg bg-page-foreground/20 hover:bg-page-foreground/30 transition-colors text-page-foreground text-sm"
            hidden
          ></button>
          <button
            id="weather-trigger"
            class="relative flex items-center gap-1 h-12 px-3 rounded-lg bg-page-foreground/20 hover:bg-page-foreground/30 transition-colors text-page-foreground text-sm"
            hidden
          ></button>
          <button
            id="todo-trigger"
            class="relative flex items-center justify-center w-12 h-12 rounded-lg bg-page-foreground/20 hover:bg-page-foreground/30 transition-colors text-page-foreground"
            aria-label="Todos"
            hidden
          >
            <span
              id="todo-badge-count"
              class="absolute -top-1 -right-1 text-[10px] bg-page-foreground/90 text-page-overlay rounded-full min-w-[18px] h-[18px] flex items-center justify-center font-semibold"
              hidden
            ></span>
            <span
              id="todo-badge-overdue"
              class="absolute -top-1 -left-1 text-[10px] bg-danger text-danger-foreground rounded-full min-w-[18px] h-[18px] flex items-center justify-center font-semibold"
              hidden
            ></span>
          </button>
          <button
            id="notepad-trigger"
            class="relative flex items-center justify-center w-12 h-12 rounded-lg bg-page-foreground/20 hover:bg-page-foreground/30 transition-colors text-page-foreground"
            aria-label="Notepad"
            hidden
          >
            <span
              id="notepad-badge"
              class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-page-foreground/80"
              hidden
            ></span>
          </button>
          <button
            id="github-trigger"
            class="relative flex items-center justify-center w-12 h-12 rounded-lg bg-page-foreground/20 hover:bg-page-foreground/30 transition-colors text-page-foreground"
            aria-label="GitHub"
            hidden
          >
            <span
              id="github-badge"
              class="absolute -top-1 -right-1 text-[10px] bg-page-foreground/90 text-page-overlay rounded-full min-w-[18px] h-[18px] flex items-center justify-center font-semibold"
              hidden
            ></span>
          </button>
          <button
            id="mail-trigger"
            class="relative flex items-center justify-center w-12 h-12 rounded-lg bg-page-foreground/20 hover:bg-page-foreground/30 transition-colors text-page-foreground"
            aria-label="Mail"
            hidden
          >
            <span
              id="mail-badge"
              class="absolute -top-1 -right-1 text-[10px] bg-page-foreground/90 text-page-overlay rounded-full min-w-[18px] h-[18px] flex items-center justify-center font-semibold"
              hidden
            ></span>
          </button>
          <button
            id="linear-trigger"
            class="relative flex items-center justify-center w-12 h-12 rounded-lg bg-page-foreground/20 hover:bg-page-foreground/30 transition-colors text-page-foreground"
            aria-label="Linear"
            hidden
          >
            <span
              id="linear-badge"
              class="absolute -top-1 -right-1 text-[10px] bg-page-foreground/90 text-page-overlay rounded-full min-w-[18px] h-[18px] flex items-center justify-center font-semibold"
              hidden
            ></span>
          </button>
        </div>

        <div id="clock" class="text-page-foreground font-mono tabular-nums"></div>

        <div
          id="world-clocks"
          class="world-clock-row flex flex-wrap items-stretch gap-2"
          hidden
        ></div>

        <div id="search-wrapper" class="w-full">
          <input
            id="search-input"
            type="text"
            placeholder="Search..."
            class="w-full px-4 py-3 rounded-theme bg-panel/90 backdrop-blur-md border border-input-border/20 text-foreground placeholder-muted outline-none text-lg"
          />
          <div
            id="search-results"
            class="mt-1 rounded-theme bg-panel/90 backdrop-blur-md border border-input-border/20 overflow-hidden"
            hidden
          ></div>
        </div>

        <div id="dock-wrapper" class="dock-wrapper pointer-events-none" hidden>
          <div id="dock" class="pointer-events-auto">
            <div id="dock-scroll" class="dock-scroll">
              <div id="dock-groups" class="dock-groups">
                <div id="dock-suggestions" class="dock-group" hidden></div>
                <div id="dock-divider" class="dock-divider" hidden></div>
                <div id="dock-items" class="dock-group"></div>
              </div>
            </div>
          </div>
          <div id="dock-tabs" class="dock-tabs pointer-events-auto" hidden>
            <span id="dock-tabs-indicator" class="dock-tab-indicator" hidden></span>
          </div>
        </div>
      </div>
    </div>


    <script src="index.js"></script>
  </body>
</html>
