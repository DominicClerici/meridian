<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <button id="settings-open" class="fixed top-4 left-4 p-2 rounded-lg bg-white/20 hover:bg-white/30 transition-colors" aria-label="Open settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <div id="search-wrapper" class="fixed inset-0 flex items-center justify-center pointer-events-none">
      <div class="w-full max-w-lg pointer-events-auto">
        <input id="search-input" type="text" placeholder="Search..."
          class="w-full px-4 py-3 rounded-xl bg-black/30 text-white placeholder-white/50 outline-none text-lg">
        <div id="search-results" class="mt-1 rounded-xl bg-black/30 overflow-hidden" hidden></div>
      </div>
    </div>
    <div id="dock" class="fixed bottom-0 left-0 right-0 flex items-center gap-2 p-2 bg-black/30" hidden>
      <div id="dock-tabs" class="flex gap-1 border-r border-white/20 pr-2 mr-2"></div>
      <div id="dock-items" class="flex gap-2 overflow-x-auto"></div>
    </div>
  </div>

  <dialog id="settings-dialog" aria-labelledby="settings-title" class="rounded-xl p-0 backdrop:bg-black/50">
    <div class="p-6 min-w-[300px]">
      <h2 id="settings-title" class="text-lg font-semibold mb-4">Settings</h2>
      <fieldset class="border-0 p-0 m-0">
        <legend class="text-sm font-medium mb-2">Background Color</legend>
        <div class="flex gap-2">
          <button data-color="red" aria-pressed="false" class="px-4 py-2 rounded-lg bg-red-500 text-white hover:opacity-80 transition-opacity">Red</button>
          <button data-color="green" aria-pressed="false" class="px-4 py-2 rounded-lg bg-green-500 text-white hover:opacity-80 transition-opacity">Green</button>
          <button data-color="blue" aria-pressed="false" class="px-4 py-2 rounded-lg bg-blue-500 text-white hover:opacity-80 transition-opacity">Blue</button>
        </div>
      </fieldset>
      <fieldset class="border-0 p-0 m-0 mt-4">
        <legend class="text-sm font-medium mb-2">Shortcuts</legend>
        <div id="sc-controls" class="flex gap-2 mb-2 flex-wrap items-center">
          <select id="sc-tab-select" class="text-sm rounded px-2 py-1 border border-gray-300"></select>
          <button id="sc-add-tab" class="text-xs px-2 py-1 rounded bg-blue-500 text-white hover:bg-blue-600">Add Tab</button>
          <button id="sc-delete-tab" class="text-xs px-2 py-1 rounded bg-red-500 text-white hover:bg-red-600" hidden>Delete Tab</button>
          <button id="sc-add-shortcut" class="text-xs px-2 py-1 rounded bg-green-500 text-white hover:bg-green-600" hidden>Add Shortcut</button>
          <button id="sc-add-folder" class="text-xs px-2 py-1 rounded bg-yellow-500 text-white hover:bg-yellow-600" hidden>Add Folder</button>
          <button id="sc-back" class="text-xs px-2 py-1 rounded bg-gray-500 text-white hover:bg-gray-600" hidden>Back</button>
        </div>
        <div id="sc-list" class="flex flex-col gap-1 max-h-48 overflow-y-auto"></div>
      </fieldset>
      <fieldset class="border-0 p-0 m-0 mt-4">
        <legend class="text-sm font-medium mb-2">Search</legend>
        <div class="flex flex-col gap-3">
          <div class="flex items-center gap-2">
            <label for="settings-search-engine" class="text-sm">Search Engine</label>
            <select id="settings-search-engine" class="text-sm rounded px-2 py-1 border border-gray-300">
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="yahoo">Yahoo</option>
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="ecosia">Ecosia</option>
              <option value="qwant">Qwant</option>
              <option value="startpage">Startpage</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="settings-debounce-search" class="rounded">
            <label for="settings-debounce-search" class="text-sm">Debounce shortcut search</label>
          </div>
        </div>
      </fieldset>
      <button id="settings-close" class="mt-6 px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors text-sm">Close</button>
    </div>
  </dialog>

  <dialog id="sc-prompt-dialog" class="rounded-xl p-0 backdrop:bg-black/50">
    <form method="dialog" class="p-4 min-w-[260px] flex flex-col gap-3">
      <h3 id="sc-prompt-title" class="text-sm font-semibold"></h3>
      <input id="sc-prompt-name" type="text" placeholder="Name" class="text-sm rounded px-2 py-1 border border-gray-300" required>
      <input id="sc-prompt-url" type="text" placeholder="URL" class="text-sm rounded px-2 py-1 border border-gray-300">
      <div class="flex gap-2 justify-end">
        <button type="button" id="sc-prompt-cancel" class="text-xs px-3 py-1 rounded bg-gray-200 hover:bg-gray-300">Cancel</button>
        <button type="submit" id="sc-prompt-save" class="text-xs px-3 py-1 rounded bg-blue-500 text-white hover:bg-blue-600">Save</button>
      </div>
    </form>
  </dialog>

  <script src="index.js"></script>
</body>
</html>
