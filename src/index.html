<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <button
        id="settings-open"
        class="fixed top-4 left-4 p-2 rounded-lg bg-page-foreground/20 hover:bg-page-foreground/30 transition-colors"
        aria-label="Open settings"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
      <div id="widgets" class="fixed top-4 right-4 flex items-center gap-2">
        <button
          id="calendar-trigger"
          class="flex items-center gap-1 p-2 rounded-lg bg-page-foreground/20 hover:bg-page-foreground/30 transition-colors text-page-foreground text-sm"
          hidden
        ></button>
        <button
          id="weather-trigger"
          class="flex items-center gap-1 p-2 rounded-lg bg-page-foreground/20 hover:bg-page-foreground/30 transition-colors text-page-foreground text-sm"
          hidden
        ></button>
        <button
          id="todo-trigger"
          class="relative flex items-center gap-1 p-2 rounded-lg bg-page-foreground/20 hover:bg-page-foreground/30 transition-colors text-page-foreground"
          aria-label="Todos"
          hidden
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M11 18H3" />
            <path d="M11 12H3" />
            <path d="M11 6H3" />
            <path d="m15 9 3 3-3 3" />
          </svg>
          <span
            id="todo-badge-count"
            class="absolute -top-1 -right-1 text-[10px] bg-page-foreground/90 text-page-overlay rounded-full min-w-[18px] h-[18px] flex items-center justify-center font-semibold"
            hidden
          ></span>
          <span
            id="todo-badge-overdue"
            class="absolute -top-1 -left-1 text-[10px] bg-danger text-danger-foreground rounded-full min-w-[18px] h-[18px] flex items-center justify-center font-semibold"
            hidden
          ></span>
        </button>
      </div>
      <div
        id="search-wrapper"
        class="fixed inset-0 flex items-center justify-center pointer-events-none"
      >
        <div class="w-full max-w-lg pointer-events-auto">
          <div
            id="clock"
            class="text-center text-page-foreground mb-4 tabular-nums"
          ></div>
          <input
            id="search-input"
            type="text"
            placeholder="Search..."
            class="w-full px-4 py-3 rounded-xl bg-page-overlay/30 text-page-foreground placeholder-page-foreground/50 outline-none text-lg"
          />
          <div
            id="search-results"
            class="mt-1 rounded-xl bg-page-overlay/30 overflow-hidden"
            hidden
          ></div>
        </div>
      </div>
      <div
        id="dock"
        class="fixed bottom-0 left-0 right-0 flex items-center gap-2 p-2 bg-page-overlay/30"
        hidden
      >
        <div
          id="dock-tabs"
          class="flex gap-1 border-r border-page-foreground/20 pr-2 mr-2"
        ></div>
        <div id="dock-items" class="flex gap-2 overflow-x-auto"></div>
      </div>
    </div>

    <dialog
      id="settings-dialog"
      aria-labelledby="settings-title"
      class="m-auto rounded-theme p-0 border-none bg-panel text-foreground overflow-hidden"
    >
      <div class="flex w-[725px] h-[480px] max-h-[80vh]">
        <nav
          id="settings-nav"
          class="relative flex flex-col items-center w-16 shrink-0 py-3 gap-1 border-r border-input-border/15"
          aria-label="Settings sections"
        ></nav>
        <div class="flex-1 flex flex-col min-w-0">
          <div
            class="flex items-center justify-between px-6 h-14 shrink-0 border-b border-input-border/10"
          >
            <h2
              id="settings-title"
              class="text-base font-semibold tracking-tight"
            >
              General
            </h2>
            <button
              id="settings-close"
              class="w-8 h-8 flex items-center justify-center rounded-theme text-muted hover:text-foreground hover:bg-surface transition-colors"
              aria-label="Close settings"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
          <div id="settings-panels" class="relative flex-1 overflow-y-auto">
            <div data-settings-tab="general" class="settings-panel"></div>

            <div
              data-settings-tab="shortcuts"
              class="settings-panel p-6"
              hidden
            >
              <div
                id="sc-controls"
                class="flex gap-2 mb-3 flex-wrap items-center"
              >
                <select
                  id="sc-tab-select"
                  class="text-sm rounded px-2 py-1 border border-input-border bg-input"
                ></select>
                <button
                  id="sc-add-tab"
                  class="text-xs px-2 py-1 rounded bg-accent text-accent-foreground hover:bg-accent-hover"
                >
                  Add Tab
                </button>
                <button
                  id="sc-delete-tab"
                  class="text-xs px-2 py-1 rounded bg-danger text-danger-foreground hover:bg-danger-hover"
                  hidden
                >
                  Delete Tab
                </button>
                <button
                  id="sc-add-shortcut"
                  class="text-xs px-2 py-1 rounded bg-success text-success-foreground hover:bg-success-hover"
                  hidden
                >
                  Add Shortcut
                </button>
                <button
                  id="sc-add-folder"
                  class="text-xs px-2 py-1 rounded bg-warning text-warning-foreground hover:bg-warning-hover"
                  hidden
                >
                  Add Folder
                </button>
                <button
                  id="sc-back"
                  class="text-xs px-2 py-1 rounded bg-neutral text-neutral-foreground hover:bg-neutral-hover"
                  hidden
                >
                  Back
                </button>
              </div>
              <button
                id="sc-import-history"
                type="button"
                class="text-xs px-2 py-1 rounded bg-special text-special-foreground hover:bg-special-hover mb-3"
                hidden
              >
                Import from History
              </button>
              <div
                id="sc-list"
                class="flex flex-col gap-1 max-h-[320px] overflow-y-auto"
              ></div>
              <div class="flex items-center gap-2 mt-4 pt-3 border-t border-input-border/15">
                <input
                  type="checkbox"
                  id="settings-recommendations-enabled"
                  class="rounded accent-accent shrink-0"
                />
                <label for="settings-recommendations-enabled" class="text-sm"
                  >Show smart suggestions in dock</label
                >
              </div>
            </div>

            <div
              data-settings-tab="appearance"
              class="settings-panel"
              hidden
            ></div>

            <div data-settings-tab="widgets" class="settings-panel" hidden></div>

            <div data-settings-tab="advanced" class="settings-panel p-6" hidden>
              <div
                class="flex flex-col items-center justify-center min-h-[320px] gap-3"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="32"
                  height="32"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="text-muted/30"
                >
                  <path
                    d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
                  />
                </svg>
                <p class="text-sm text-muted/40">No advanced settings yet</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </dialog>

    <dialog
      id="sc-prompt-dialog"
      class="rounded-xl p-0 backdrop:bg-page-overlay/50 bg-panel text-foreground"
    >
      <form method="dialog" class="p-4 min-w-[260px] flex flex-col gap-3">
        <h3 id="sc-prompt-title" class="text-sm font-semibold"></h3>
        <input
          id="sc-prompt-name"
          type="text"
          placeholder="Name"
          class="text-sm rounded px-2 py-1 border border-input-border bg-input"
          required
        />
        <input
          id="sc-prompt-url"
          type="text"
          placeholder="URL"
          class="text-sm rounded px-2 py-1 border border-input-border bg-input"
        />
        <div class="flex gap-2 justify-end">
          <button
            type="button"
            id="sc-prompt-cancel"
            class="text-xs px-3 py-1 rounded bg-secondary hover:bg-secondary-hover text-secondary-foreground"
          >
            Cancel
          </button>
          <button
            type="submit"
            id="sc-prompt-save"
            class="text-xs px-3 py-1 rounded bg-accent text-accent-foreground hover:bg-accent-hover"
          >
            Save
          </button>
        </div>
      </form>
    </dialog>

    <dialog
      id="history-import-dialog"
      class="rounded-xl p-0 backdrop:bg-page-overlay/50 bg-panel text-foreground"
    >
      <div class="p-6 min-w-[340px] max-w-[480px]">
        <h3 class="text-sm font-semibold mb-3">Import from History</h3>
        <div id="history-import-loading" class="text-sm text-muted">
          Loading history...
        </div>
        <div
          id="history-import-list"
          class="flex flex-col gap-1 max-h-[400px] overflow-y-auto"
          hidden
        ></div>
        <div id="history-import-empty" class="text-sm text-muted" hidden>
          No new sites found in your history.
        </div>
        <div id="history-import-error" class="text-sm text-danger" hidden>
          Could not load history.
        </div>
        <button
          id="history-import-close"
          type="button"
          class="mt-4 px-4 py-2 rounded-lg bg-secondary hover:bg-secondary-hover text-secondary-foreground transition-colors text-sm"
        >
          Close
        </button>
      </div>
    </dialog>

    <script src="index.js"></script>
  </body>
</html>
