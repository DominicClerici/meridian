<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <button id="settings-open" class="fixed top-4 left-4 p-2 rounded-lg bg-white/20 hover:bg-white/30 transition-colors" aria-label="Open settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <div id="widgets" class="fixed top-4 right-4 flex items-center gap-2">
      <button id="weather-trigger" class="flex items-center gap-1 p-2 rounded-lg bg-white/20 hover:bg-white/30 transition-colors text-white text-sm" hidden></button>
      <button id="todo-trigger" class="relative flex items-center gap-1 p-2 rounded-lg bg-white/20 hover:bg-white/30 transition-colors text-white" aria-label="Todos" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 18H3"/>
          <path d="M11 12H3"/>
          <path d="M11 6H3"/>
          <path d="m15 9 3 3-3 3"/>
        </svg>
        <span id="todo-badge-count" class="absolute -top-1 -right-1 text-[10px] bg-white/90 text-black rounded-full min-w-[18px] h-[18px] flex items-center justify-center font-semibold" hidden></span>
        <span id="todo-badge-overdue" class="absolute -top-1 -left-1 text-[10px] bg-red-500 text-white rounded-full min-w-[18px] h-[18px] flex items-center justify-center font-semibold" hidden></span>
      </button>
    </div>
    <div id="search-wrapper" class="fixed inset-0 flex items-center justify-center pointer-events-none">
      <div class="w-full max-w-lg pointer-events-auto">
        <div id="clock" class="text-center text-white mb-4 tabular-nums"></div>
        <input id="search-input" type="text" placeholder="Search..."
          class="w-full px-4 py-3 rounded-xl bg-black/30 text-white placeholder-white/50 outline-none text-lg">
        <div id="search-results" class="mt-1 rounded-xl bg-black/30 overflow-hidden" hidden></div>
      </div>
    </div>
    <div id="dock" class="fixed bottom-0 left-0 right-0 flex items-center gap-2 p-2 bg-black/30" hidden>
      <div id="dock-tabs" class="flex gap-1 border-r border-white/20 pr-2 mr-2"></div>
      <div id="dock-items" class="flex gap-2 overflow-x-auto"></div>
    </div>
  </div>

  <dialog id="settings-dialog" aria-labelledby="settings-title" class="rounded-xl p-0 backdrop:bg-black/50">
    <div class="p-6 min-w-[300px]">
      <h2 id="settings-title" class="text-lg font-semibold mb-4">Settings</h2>
      <fieldset class="border-0 p-0 m-0">
        <legend class="text-sm font-medium mb-2">Background Color</legend>
        <div class="flex gap-2">
          <button data-color="red" aria-pressed="false" class="px-4 py-2 rounded-lg bg-red-500 text-white hover:opacity-80 transition-opacity">Red</button>
          <button data-color="green" aria-pressed="false" class="px-4 py-2 rounded-lg bg-green-500 text-white hover:opacity-80 transition-opacity">Green</button>
          <button data-color="blue" aria-pressed="false" class="px-4 py-2 rounded-lg bg-blue-500 text-white hover:opacity-80 transition-opacity">Blue</button>
        </div>
      </fieldset>
      <fieldset class="border-0 p-0 m-0 mt-4">
        <legend class="text-sm font-medium mb-2">Shortcuts</legend>
        <div id="sc-controls" class="flex gap-2 mb-2 flex-wrap items-center">
          <select id="sc-tab-select" class="text-sm rounded px-2 py-1 border border-gray-300"></select>
          <button id="sc-add-tab" class="text-xs px-2 py-1 rounded bg-blue-500 text-white hover:bg-blue-600">Add Tab</button>
          <button id="sc-delete-tab" class="text-xs px-2 py-1 rounded bg-red-500 text-white hover:bg-red-600" hidden>Delete Tab</button>
          <button id="sc-add-shortcut" class="text-xs px-2 py-1 rounded bg-green-500 text-white hover:bg-green-600" hidden>Add Shortcut</button>
          <button id="sc-add-folder" class="text-xs px-2 py-1 rounded bg-yellow-500 text-white hover:bg-yellow-600" hidden>Add Folder</button>
          <button id="sc-back" class="text-xs px-2 py-1 rounded bg-gray-500 text-white hover:bg-gray-600" hidden>Back</button>
        </div>
        <button id="sc-import-history" type="button" class="text-xs px-2 py-1 rounded bg-purple-500 text-white hover:bg-purple-600 self-start mb-1" hidden>Import from History</button>
        <div id="sc-list" class="flex flex-col gap-1 max-h-48 overflow-y-auto"></div>
      </fieldset>
      <fieldset class="border-0 p-0 m-0 mt-4">
        <legend class="text-sm font-medium mb-2">Recommendations</legend>
        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="settings-recommendations-enabled" class="rounded">
            <label for="settings-recommendations-enabled" class="text-sm">Show smart suggestions in dock</label>
          </div>
        </div>
      </fieldset>
      <fieldset class="border-0 p-0 m-0 mt-4">
        <legend class="text-sm font-medium mb-2">Search</legend>
        <div class="flex flex-col gap-3">
          <div class="flex items-center gap-2">
            <label for="settings-search-engine" class="text-sm">Search Engine</label>
            <select id="settings-search-engine" class="text-sm rounded px-2 py-1 border border-gray-300">
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="yahoo">Yahoo</option>
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="ecosia">Ecosia</option>
              <option value="qwant">Qwant</option>
              <option value="startpage">Startpage</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="settings-debounce-search" class="rounded">
            <label for="settings-debounce-search" class="text-sm">Debounce shortcut search</label>
          </div>
        </div>
      </fieldset>
      <fieldset id="settings-clock" class="border-0 p-0 m-0 mt-4">
        <legend class="text-sm font-medium mb-2">Clock</legend>
        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="settings-clock-enabled" class="rounded">
            <label for="settings-clock-enabled" class="text-sm">Show clock</label>
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="settings-clock-seconds" class="rounded">
            <label for="settings-clock-seconds" class="text-sm">Show seconds</label>
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="settings-clock-24h" class="rounded">
            <label for="settings-clock-24h" class="text-sm">24-hour format</label>
          </div>
          <div id="settings-clock-ampm-row" class="flex items-center gap-2">
            <input type="checkbox" id="settings-clock-ampm" class="rounded">
            <label for="settings-clock-ampm" class="text-sm">Show AM/PM</label>
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="settings-clock-date" class="rounded">
            <label for="settings-clock-date" class="text-sm">Show date</label>
          </div>
          <div id="settings-clock-date-format-row" class="flex items-center gap-2">
            <label for="settings-clock-date-format" class="text-sm">Date format</label>
            <select id="settings-clock-date-format" class="text-sm rounded px-2 py-1 border border-gray-300">
              <option value="long">January 24th</option>
              <option value="short">Jan. 24th</option>
              <option value="abbr">Jan 24</option>
              <option value="numeric">01/24/2024</option>
              <option value="numericShort">01/24</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label for="settings-clock-size" class="text-sm">Size</label>
            <select id="settings-clock-size" class="text-sm rounded px-2 py-1 border border-gray-300">
              <option value="small">Small</option>
              <option value="medium">Medium</option>
              <option value="large">Large</option>
            </select>
          </div>
        </div>
      </fieldset>
      <fieldset id="settings-todo" class="border-0 p-0 m-0 mt-4">
        <legend class="text-sm font-medium mb-2">Todo</legend>
        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="settings-todo-enabled" class="rounded">
            <label for="settings-todo-enabled" class="text-sm">Enable todo widget</label>
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="settings-todo-badges" class="rounded">
            <label for="settings-todo-badges" class="text-sm">Show badges</label>
          </div>
          <button id="settings-todo-clear" type="button" class="text-xs px-2 py-1 rounded bg-red-500 text-white hover:bg-red-600 self-start">Clear all todos</button>
        </div>
      </fieldset>
      <fieldset id="settings-weather" class="border-0 p-0 m-0 mt-4">
        <legend class="text-sm font-medium mb-2">Weather</legend>
        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="settings-weather-enabled" class="rounded">
            <label for="settings-weather-enabled" class="text-sm">Enable weather</label>
          </div>
          <div class="flex items-center gap-2">
            <label for="settings-weather-unit" class="text-sm">Temperature unit</label>
            <select id="settings-weather-unit" class="text-sm rounded px-2 py-1 border border-gray-300">
              <option value="f">Fahrenheit</option>
              <option value="c">Celsius</option>
            </select>
          </div>
          <div id="settings-weather-location-row">
            <button id="settings-weather-grant" type="button" class="text-xs px-2 py-1 rounded bg-blue-500 text-white hover:bg-blue-600">Grant location access</button>
            <p id="settings-weather-location-help" class="text-xs text-gray-500 mt-1" hidden>Location access was denied. Please enable it in your browser settings for this extension.</p>
          </div>
        </div>
      </fieldset>
      <fieldset id="settings-spotify" class="border-0 p-0 m-0 mt-4">
        <legend class="text-sm font-medium mb-2">Spotify</legend>
        <div class="flex flex-col gap-2">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="settings-spotify-enabled" class="rounded">
            <label for="settings-spotify-enabled" class="text-sm">Enable Spotify widget</label>
          </div>
          <div id="settings-spotify-connect-row">
            <button id="settings-spotify-connect" type="button" class="text-xs px-2 py-1 rounded bg-green-500 text-white hover:bg-green-600">Connect Spotify</button>
          </div>
          <div id="settings-spotify-disconnect-row" hidden>
            <button id="settings-spotify-disconnect" type="button" class="text-xs px-2 py-1 rounded bg-red-500 text-white hover:bg-red-600">Disconnect</button>
          </div>
        </div>
      </fieldset>
      <button id="settings-close" class="mt-6 px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors text-sm">Close</button>
    </div>
  </dialog>

  <dialog id="sc-prompt-dialog" class="rounded-xl p-0 backdrop:bg-black/50">
    <form method="dialog" class="p-4 min-w-[260px] flex flex-col gap-3">
      <h3 id="sc-prompt-title" class="text-sm font-semibold"></h3>
      <input id="sc-prompt-name" type="text" placeholder="Name" class="text-sm rounded px-2 py-1 border border-gray-300" required>
      <input id="sc-prompt-url" type="text" placeholder="URL" class="text-sm rounded px-2 py-1 border border-gray-300">
      <div class="flex gap-2 justify-end">
        <button type="button" id="sc-prompt-cancel" class="text-xs px-3 py-1 rounded bg-gray-200 hover:bg-gray-300">Cancel</button>
        <button type="submit" id="sc-prompt-save" class="text-xs px-3 py-1 rounded bg-blue-500 text-white hover:bg-blue-600">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="todo-prompt-dialog" class="rounded-xl p-0 backdrop:bg-black/50">
    <form method="dialog" class="p-4 min-w-[300px] flex flex-col gap-3">
      <h3 id="todo-prompt-title" class="text-sm font-semibold"></h3>
      <input id="todo-prompt-title-input" type="text" placeholder="Title" class="text-sm rounded px-2 py-1 border border-gray-300" required maxlength="256">
      <textarea id="todo-prompt-desc" placeholder="Description (optional)" class="text-sm rounded px-2 py-1 border border-gray-300 resize-y" rows="3" maxlength="1024"></textarea>
      <input id="todo-prompt-url" type="url" placeholder="URL (optional)" class="text-sm rounded px-2 py-1 border border-gray-300">
      <input id="todo-prompt-due" type="date" class="text-sm rounded px-2 py-1 border border-gray-300">
      <div class="flex gap-2 justify-end">
        <button type="button" id="todo-prompt-cancel" class="text-xs px-3 py-1 rounded bg-gray-200 hover:bg-gray-300">Cancel</button>
        <button type="submit" id="todo-prompt-save" class="text-xs px-3 py-1 rounded bg-blue-500 text-white hover:bg-blue-600">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="history-import-dialog" class="rounded-xl p-0 backdrop:bg-black/50">
    <div class="p-6 min-w-[340px] max-w-[480px]">
      <h3 class="text-sm font-semibold mb-3">Import from History</h3>
      <div id="history-import-loading" class="text-sm text-gray-500">Loading history...</div>
      <div id="history-import-list" class="flex flex-col gap-1 max-h-[400px] overflow-y-auto" hidden></div>
      <div id="history-import-empty" class="text-sm text-gray-500" hidden>No new sites found in your history.</div>
      <div id="history-import-error" class="text-sm text-red-500" hidden>Could not load history.</div>
      <button id="history-import-close" type="button" class="mt-4 px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors text-sm">Close</button>
    </div>
  </dialog>

  <script src="index.js"></script>
</body>
</html>
